<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:#f9f0f1;min-height:100vh;}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);padding:12px 24px;border-bottom:1px solid #e6cdd0;}
.bc{font-size:.82rem;color:#8a7573;}
.bc a{color:#7A1B24;font-weight:700;}
.bc .sep{margin:0 6px;opacity:.4;}
.hero{padding:28px 24px 16px;text-align:center;background:#FCF3F3;border-bottom:1px solid #e6cdd0;}
.hero .kicker{color:#7A1B24;letter-spacing:3px;font-size:.72rem;font-weight:700;margin-bottom:6px;}
.hero h1{font-size:1.7rem;font-weight:700;color:#4E1015;margin-bottom:4px;}
.hero p{color:#8a7573;font-size:.82rem;}
.hint{text-align:center;padding:10px 16px;color:#8a7573;font-size:.8rem;}
.scroll-wrap{overflow-x:auto;padding:20px 8px 80px;-webkit-overflow-scrolling:touch;}
footer{text-align:center;padding:22px;color:#8a7573;font-size:.76rem;border-top:1px solid #e6cdd0;margin-top:10px;}

/* draw animation */
@keyframes drawRect{
  from{stroke-dashoffset:var(--perimeter,900);}
  to{stroke-dashoffset:0;}
}
@keyframes fillIn{
  from{fill-opacity:0;}
  to{fill-opacity:1;}
}

.node-shape{
  stroke-dasharray:var(--perimeter,900);
  stroke-dashoffset:var(--perimeter,900);
  fill-opacity:0;
  animation:
    drawRect .5s cubic-bezier(.4,0,.2,1) forwards,
    fillIn .3s ease .45s forwards;
}

/* connector lines draw */
@keyframes drawLine{
  from{stroke-dashoffset:400;}
  to{stroke-dashoffset:0;}
}
.conn{
  stroke:#bbb;stroke-width:1.8;fill:none;
  stroke-dasharray:400;
  stroke-dashoffset:400;
  animation:drawLine .4s ease forwards;
}

/* typewriter text — hidden then typed by JS */
.nd-text{opacity:0;}
.nd-text.typed{opacity:1;}

.node-g{cursor:pointer;}
.node-g:hover .node-shape{filter:brightness(1.1);}

.hidden{display:none;}
svg text{font-family:'Tajawal',sans-serif;text-anchor:middle;dominant-baseline:middle;}
</style>
</head>

<script>
/* typewriter for SVG text */
function typeText(el, delay){
  var full = el.textContent;
  el.textContent = '';
  el.style.opacity = '1';
  var i = 0;
  setTimeout(function tick(){
    if(i <= full.length){
      el.textContent = full.slice(0,i);
      i++;
      setTimeout(tick, 28);
    }
  }, delay * 1000);
}

function animateGroup(groupEl){
  /* reset + run draw animation on shapes */
  groupEl.querySelectorAll('.node-shape').forEach(function(s){
    var delay = parseFloat(s.style.animationDelay||'0');
    var per = parseFloat(s.style.getPropertyValue('--perimeter')||'900');
    s.style.strokeDasharray = per;
    s.style.strokeDashoffset = per;
    s.style.fillOpacity = '0';
    s.style.animation = 'none';
    void s.offsetWidth;
    s.style.animation =
      'drawRect .5s cubic-bezier(.4,0,.2,1) '+delay+'s forwards, '+
      'fillIn .3s ease '+(delay+.45)+'s forwards';
  });
  /* connector lines */
  groupEl.querySelectorAll('.conn').forEach(function(l){
    var delay = parseFloat(l.style.animationDelay||'0');
    var da = parseFloat(l.style.strokeDasharray||'400');
    l.style.strokeDashoffset = da;
    l.style.animation = 'none';
    void l.offsetWidth;
    l.style.animation = 'drawLine .4s ease '+delay+'s forwards';
  });
  /* typewriter on texts */
  groupEl.querySelectorAll('.nd-text').forEach(function(t){
    var delay = parseFloat(t.style.animationDelay||'.2');
    typeText(t, delay);
  });
}

var revealed = {1:false,2:false,3:false,4:false,5:false};

function revealLevel(n){
  if(revealed[n]) return;
  revealed[n] = true;
  var g = document.getElementById('lv'+n);
  if(!g) return;
  g.classList.remove('hidden');
  animateGroup(g);
}

function toggleSub(id){
  var el = document.getElementById(id);
  if(!el) return;
  if(el.classList.contains('hidden')){
    el.classList.remove('hidden');
    animateGroup(el);
  } else {
    el.classList.add('hidden');
  }
}
</script>
