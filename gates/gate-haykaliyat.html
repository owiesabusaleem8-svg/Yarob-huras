<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الهيكليات — يعرب</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --m:#7A1B24;--md:#4E1015;--ml:#e6cdd0;--tint:#FCF3F3;
  --w:#fff;--ink:#2b2220;--soft:#8a7573;--ln:#d4c4c2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:var(--w);line-height:1.7;}
a{color:inherit;text-decoration:none;}

header{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);padding:14px 28px;border-bottom:1px solid var(--ml);}
.bc{font-size:.84rem;color:var(--soft);}
.bc a{color:var(--m);font-weight:700;}
.bc .sep{margin:0 8px;opacity:.4;}

.hero{padding:44px 28px 30px;text-align:center;background:var(--tint);border-bottom:1px solid var(--ml);}
.hero .kicker{color:var(--m);letter-spacing:3px;font-size:.74rem;font-weight:700;margin-bottom:10px;}
.hero h1{font-family:'Aref Ruqaa',serif;font-size:2.2rem;color:var(--md);margin-bottom:8px;}
.hero p{color:var(--soft);font-size:.92rem;}

.tabs{display:flex;justify-content:center;gap:10px;padding:24px 20px 0;flex-wrap:wrap;}
.tab{padding:11px 28px;border-radius:999px;border:1.5px solid var(--ml);
  background:var(--w);color:var(--md);font-family:'Tajawal',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s;}
.tab:hover{border-color:var(--m);}
.tab.on{background:var(--m);border-color:var(--m);color:#fff;}

.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 20px 4px;}
.lg{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--soft);
  background:var(--tint);border:1px solid var(--ml);border-radius:999px;padding:5px 13px;}
.lg i{width:11px;height:11px;border-radius:3px;display:block;}

.stage{padding:28px 20px 80px;max-width:900px;margin:0 auto;}
.panel{display:none;} .panel.on{display:block;}

/* ── top row (3 هيئات) ── */
.top-row{display:flex;border-radius:12px;overflow:hidden;margin-bottom:0;}
.top-cell{flex:1;padding:16px 14px;font-weight:700;font-size:.88rem;
  text-align:center;line-height:1.5;}
.tc-dark{background:var(--md);color:#fff;}
.tc-orange{background:#A8505A;color:#fff;}
.tc-grey{background:#D2C3C1;color:#2b2220;}

/* connector */
.vc{width:2px;height:24px;background:var(--ln);margin:0 auto;}

/* ── accordion depts ── */
.depts{border:1.5px solid var(--ln);border-radius:12px;overflow:hidden;}
.dept{border-bottom:1px solid var(--ln);}
.dept:last-child{border-bottom:none;}

.dept-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;font-weight:700;font-size:.92rem;cursor:pointer;
  transition:filter .15s;gap:10px;
}
.dept-hdr:hover{filter:brightness(.94);}
.dept-hdr .arr{font-size:.72rem;transition:transform .2s;flex-shrink:0;}
.dept.open .dept-hdr .arr{transform:rotate(90deg);}

.dept-body{
  display:none;background:var(--w);
  padding:0 0 4px 0;
}
.dept.open .dept-body{display:block;}

/* flat items */
.items-grid{
  display:flex;flex-wrap:wrap;gap:10px;
  padding:16px 18px;
}
.item-chip{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;
  border:1px solid var(--ln);background:var(--tint);color:var(--ink);
}
.item-chip .dot{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);flex-shrink:0;}

/* sub group */
.sub-group{margin:0 18px 12px;}
.sub-hdr{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  font-weight:700;font-size:.84rem;border-radius:8px;cursor:pointer;
  border:1px solid var(--ln);margin-bottom:0;
}
.sub-hdr .arr{font-size:.68rem;transition:transform .18s;flex-shrink:0;}
.sub-hdr.open .arr{transform:rotate(90deg);}
.sub-children{display:none;padding:10px 18px 4px;}
.sub-hdr.open + .sub-children{display:flex;flex-wrap:wrap;gap:8px;}
.sub-children .item-chip{font-size:.78rem;}

/* color classes */
.bg-dark{background:var(--md);color:#fff;}
.bg-gold{background:#F1E2D3;color:#2b2220;}
.bg-orange{background:#A8505A;color:#fff;}
.bg-red{background:#9C2530;color:#fff;}
.bg-crimson{background:#7A1B24;color:#fff;}
.bg-cream{background:#FCEFB4;color:#2b2220;}
.bg-pink{background:#F6C9C4;color:#2b2220;}
.bg-pinklite{background:#FADCD8;color:#2b2220;}
.bg-orangelite{background:#EBCFC0;color:#2b2220;}
.bg-grey{background:#D2C3C1;color:#2b2220;}
.dot-gold{background:#F1E2D3;}
.dot-crimson{background:#7A1B24;}
.dot-red{background:#9C2530;}
.dot-orange{background:#A8505A;}
.dot-pinklite{background:#FADCD8;}
.dot-dark{background:var(--md);}
.dot-cream{background:#FCEFB4;}
.dot-grey{background:#D2C3C1;}

footer{text-align:center;padding:30px;color:var(--soft);font-size:.8rem;border-top:1px solid var(--ml);}
</style>

.yp-logo{height:46px; width:auto; filter:drop-shadow(0 4px 10px rgba(122,27,36,.18));}

@media (max-width:640px){
  header{padding:8px 14px !important; gap:10px;}
  header img, .yp-logo{height:38px !important;}

}

function chip(item){
  return '<div class="item-chip"><span class="dot '+item.d+'"></span>'+item.t+'</div>';
}

function renderPanel(data,id){
  const p=document.getElementById(id); p.innerHTML='';
  // top row
  const tr=document.createElement('div'); tr.className='top-row';
  data.top.forEach(c=>{const d=document.createElement('div');d.className='top-cell '+c.c;d.textContent=c.t;tr.appendChild(d);});
  p.appendChild(tr);
  const vc=document.createElement('div'); vc.className='vc'; p.appendChild(vc);
  // depts accordion
  const acc=document.createElement('div'); acc.className='depts';
  data.depts.forEach(dept=>{
    const wrap=document.createElement('div'); wrap.className='dept';
    const hdr=document.createElement('div'); hdr.className='dept-hdr '+dept.c;
    hdr.innerHTML='<span>'+dept.t+'</span><span class="arr">◀</span>';
    wrap.appendChild(hdr);
    const body=document.createElement('div'); body.className='dept-body';
    if(dept.items && dept.items.length){
      const grid=document.createElement('div'); grid.className='items-grid';
      grid.innerHTML=dept.items.map(chip).join('');
      body.appendChild(grid);
    }
    if(dept.groups){
      dept.groups.forEach(g=>{
        const sg=document.createElement('div'); sg.className='sub-group';
        const sh=document.createElement('div'); sh.className='sub-hdr '+g.c;
        sh.innerHTML='<span class="dot '+g.d+'" style="width:9px;height:9px;border-radius:2px;transform:rotate(45deg);flex-shrink:0;display:inline-block;"></span><span style="flex:1">'+g.t+'</span><span class="arr">◀</span>';
        sg.appendChild(sh);
        if(g.items && g.items.length){
          const sc=document.createElement('div'); sc.className='sub-children';
          sc.innerHTML=g.items.map(chip).join('');
          sg.appendChild(sc);
          sh.addEventListener('click',()=>sh.classList.toggle('open'));
        }
        body.appendChild(sg);
      });
    }
    wrap.appendChild(body);
    hdr.addEventListener('click',()=>wrap.classList.toggle('open'));
    acc.appendChild(wrap);
  });
  p.appendChild(acc);
}

renderPanel(DATA.org,'p-org');
renderPanel(DATA.adm,'p-adm');

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); const p=t.dataset.p;
  document.getElementById('p-org').classList.toggle('on',p==='org');
  document.getElementById('p-adm').classList.toggle('on',p==='adm');
}));
</script>
